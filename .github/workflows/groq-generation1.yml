name: Vidhwaan School Groq Generation1

on:
  workflow_dispatch:

concurrency:
  group: vidhwaan-school-groq-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate project
        run: npm run validate

      - name: Verify Groq API keys
        env:
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
        run: |
          if [ -z "$GROQ_API_KEY_3" ]; then
            echo "ERROR: GROQ_API_KEY_3 GitHub Secret is missing."
            exit 1
          fi

          if [ -z "$GROQ_API_KEY_4" ]; then
            echo "ERROR: GROQ_API_KEY_4 GitHub Secret is missing."
            exit 1
          fi

          echo "GROQ_API_KEY_3 is configured."
          echo "GROQ_API_KEY_4 is configured."

      - name: Find and generate exactly one study day
        env:
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
        run: node generator/run-next-day1.js
