name: Vidhwaan School Groq Generation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: vidhwaan-school-groq-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate project
        run: npm run validate

      - name: Verify Groq API key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: GROQ_API_KEY GitHub Secret is missing."
            exit 1
          fi

          echo "GROQ_API_KEY is configured."

      - name: Find and generate exactly one study day
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node generator/run-next-day.js
